            - text: 
        - paragraph [ref=e109]: 这是一本面向 WorkBuddy 新用户的上手指南。全书按六个任务模块组织，从”装好它、守住边界”开始，一路讲到提示词与模型、技能与连接器、深度调研实战、专家与团队协作，最后落到资料库与记忆。
        - list [ref=e110]:
          - listitem [ref=e111]:
            - strong [ref=e112]: 核心内容
            - text: ：涵盖安全起步、Prompt 提示词与模型选择、Skill 技能与 MCP 连接器、技能实战与深度调研、专家与团队、资料库与记忆六大模块；
          - listitem [ref=e113]:
            - strong [ref=e114]: 官方文档
            - text: ：术语、按钮名称与操作步骤均保留 WorkBuddy 官方表述，共 26 个小节；
          - listitem [ref=e115]:
            - strong [ref=e116]: 如实标注
            - text: ：对官方文档未公开详述的部分（如 SKILL.md 文件规范、身份文件格式、子 Agent 配置细节），以”说明”形式标注，未作臆测；
          - listitem [ref=e117]:
            - strong [ref=e118]: 独立成篇
            - text: ：每一章都可以单独阅读，连起来则是一条完整的学习路径。
        - paragraph [ref=e119]: 本书适用于 WorkBuddy 新用户、希望系统掌握 Agent 工具使用的从业者，既可作为入门教程，也可作为功能速查手册。
