            - text: 环境要求
            - link "Anchor" [ref=e217] [cursor=pointer]:
              - /url: "#环境要求"
              - text: 
          - list [ref=e218]:
            - listitem [ref=e219]:
              - strong [ref=e220]: Windows
              - text: ：Windows 10 及以上，支持 x64；不支持 Windows 7/8/8.1。
            - listitem [ref=e221]:
              - strong [ref=e222]: macOS
              - text: ：macOS 12（Monterey）及以上。
        - generic [ref=e223]:
          - heading [level=3] [ref=e224]:
            - text: Windows 安装
            - link "Anchor" [ref=e225] [cursor=pointer]:
              - /url: "#windows-安装"
              - text: 
          - list [ref=e226]:
            - listitem [ref=e227]: 访问官网点击「立即下载」，选择 Windows，下载安装包。
            - listitem [ref=e228]: 双击安装包启动安装程序，勾选「我同意此协议」，点击「下一步」。
            - listitem [ref=e229]: 选择安装路径（默认可直接下一步），确认开始菜单文件夹。
            - listitem [ref=e230]: 建议勾选「创建桌面快捷方式」，确认配置后点击「安装」。
            - listitem [ref=e231]: 安装完成后点击「完成」退出向导。
          - generic [ref=e232]:
            - generic [ref=e233]: 说明
            - paragraph [ref=e238]: 安装用户建议选择「仅为我安装」。更新入口：头像 →「检查更新」，系统自动检测并升级。
        - generic [ref=e239]:
          - heading [level=3] [ref=e240]:
            - text: Mac 安装
            - link "Anchor" [ref=e241] [cursor=pointer]:
              - /url: "#mac-安装"
              - text: 
          - paragraph [ref=e242]:
            - text: 版本选择：
            - strong [ref=e243]: M 系列芯片
            - text: 选
            - code [ref=e244]: Mac ARM64
            - text: ，
            - strong [ref=e245]: Intel 芯片
            - text: 选
            - code [ref=e246]: Mac X64
            - text: ；官网未识别设备时默认给 X64（可通过 Rosetta 在 M 系列运行，兼容性更广）。查版本：左上角苹果图标 →「关于本机」。
          - list [ref=e247]:
            - listitem [ref=e248]:
              - text: 双击下载的
              - code [ref=e249]: .dmg
              - text: 文件，打开安装窗口。
            - listitem [ref=e250]:
              - text: 将 WorkBuddy 图标拖入
              - strong [ref=e251]: Applications（应用程序）
              - text: 文件夹。
            - listitem [ref=e252]:
              - text: 等待拷贝完成后，推出磁盘映像，可删除
              - code [ref=e253]: .dmg
              - text: 安装包。
          - generic [ref=e254]:
            - generic [ref=e255]: 注意
            - paragraph [ref=e260]:
              - text: 务必拖入「应用程序」文件夹后再启动。若直接从磁盘映像运行，WorkBuddy 将运行在只读映像上，
              - strong [ref=e261]: 后续无法自动更新
              - text: 。如检查更新失败，可点击提示中的「移动到应用程序」一键修复。
        - generic [ref=e262]:
          - heading [level=3] [ref=e263]:
            - text: 登录
            - link "Anchor" [ref=e264] [cursor=pointer]:
              - /url: "#登录"
              - text: 
          - list [ref=e265]:
            - listitem [ref=e266]: 启动 WorkBuddy，点击「登录」，浏览器自动打开登录页（workbuddy.cn）。
            - listitem [ref=e267]:
              - text: 勾选《用户服务协议》与《隐私政策》，使用
              - strong [ref=e268]: 微信扫码
              - text: 完成登录。
            - listitem [ref=e269]: 页面显示登录成功后，返回客户端即可开始使用。
          - paragraph [ref=e270]: 也支持手机号、邮箱、SSO 等方式，全程在当前页面完成。个人用户选「个人」，企业版用户选「企业」。语言切换：头像 → 设置 → 通用 → 语言。
          - separator [ref=e271]
